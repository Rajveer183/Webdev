add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# No inline scripts: the theme bootstrap is /theme-init.js and prerendered data is a JSON block.
# Inline styles stay allowed for React style props and Recharts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
# Browsers ignore HSTS over plain HTTP; it takes effect once TLS is terminated in front.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
